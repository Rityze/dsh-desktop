# Build the Windows package for one release tag.
#
# ## Why only Windows, and why it is built here rather than locally
#
# A macOS bundle cannot be produced on a Windows machine: `dmg` needs `hdiutil`,
# signing needs `codesign`, and the bundled Node under `node_modules/node/bin` is
# a Windows executable — `scripts/verify-target.mjs` refuses before any of that,
# which is the guard working rather than an obstacle to route around.
#
# This branch's macOS target is therefore not built. The configuration for it is
# still in `package.json` and `scripts/`, untouched, so a runner with a macOS
# image can produce one by adding a job that mirrors the Windows one below and
# calling `electron-builder --mac --arm64`. What is published today is Windows
# x64, which is the platform the branch was developed and measured on.
#
# ## What is verified before publishing
#
# The test suite and the type check, because a package that installs and then
# fails to start is worse than no package. They answer a question about the
# source rather than about the platform, so they run once, on Linux, ahead of the
# build rather than beside it.
name: Release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        required: true
        default: v0.1.1-local-rocmfp4

permissions:
  contents: write

jobs:
  verify:
    name: Tests and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx --no-install vitest run
      - run: npm run typecheck

  windows:
    name: Windows x64
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set the version from the tag
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.tag }}"

      - run: npm ci
      - run: npm run build

      # The wrapper rather than `electron-builder` directly: it installs the
      # patch that inserts `Call dshPromoteDirectories` into electron-builder's
      # NSIS template, without which the installer builds, warns that the
      # function is unreferenced, and leaves the install directory empty.
      - name: Package
        run: node scripts/electron-builder-windows.mjs --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: [windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what was built
        run: find artifacts -type f -printf '%p  %s bytes\n'

      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `--clobber` so a re-run replaces the previous assets rather than
          # failing on the name already being taken.
          find artifacts -type f -name '*.exe' -print0 \
            | xargs -0 -r gh release upload "${{ inputs.tag }}" --clobber
